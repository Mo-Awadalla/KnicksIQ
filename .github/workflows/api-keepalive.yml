name: API keepalive

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API liveness
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 90 \
            https://api.knicksiq.win/health/live | jq -e '.status == "ok"'
