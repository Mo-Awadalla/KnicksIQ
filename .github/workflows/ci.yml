name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 16.9-alpine, same OCI manifest as the Docker Hub image.
        image: public.ecr.aws/docker/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: knicksiq
          POSTGRES_PASSWORD: knicksiq
          POSTGRES_DB: knicksiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knicksiq -d knicksiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgresql+asyncpg://knicksiq:knicksiq@localhost:5432/knicksiq_test
      PGPASSWORD: knicksiq
      TEST_MODE: "false"
      UV_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.6"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Redis for atomic integration regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          redis-server --version
      - run: uv sync --all-packages --all-extras --dev
      - run: uv run ruff check apps packages migrations
      - run: uv run ruff format --check apps packages migrations
      - run: uv run pyright apps packages migrations
      - name: Unit and integration tests
        env:
          TEST_MODE: "true"
        run: |
          mkdir -p ci-artifacts
          uv run pytest apps packages tools/report_audit --maxfail=1 --junitxml=ci-artifacts/backend.xml --basetemp=ci-artifacts/pytest
      - name: Preserve backend HTTP and accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-http-evidence
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Empty database migration and expand-only rollback
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Postgres release-loader integration and idempotency
        env:
          KNICKSIQ_POSTGRES_TEST: "1"
          TEST_MODE: "false"
        run: uv run pytest apps/api/app/tests/test_release_bundle.py --maxfail=1
      - name: Upgrade populated pre-Alembic schema
        run: |
          createdb -h localhost -U knicksiq knicksiq_upgrade
          psql -h localhost -U knicksiq -d knicksiq_upgrade -v ON_ERROR_STOP=1 \
            -f migrations/fixtures/pre_alembic_minimal.sql
          DB_URL=postgresql+asyncpg://knicksiq:knicksiq@localhost:5432/knicksiq_upgrade \
            uv run alembic upgrade head
          psql -h localhost -U knicksiq -d knicksiq_upgrade -v ON_ERROR_STOP=1 -c \
            "SELECT 1 FROM reports WHERE title='Legacy report' AND reviewed=false"
          psql -h localhost -U knicksiq -d knicksiq_upgrade -v ON_ERROR_STOP=1 -c \
            "INSERT INTO dataset_releases (version,season,source,manifest_sha256,manifest_json,validation_json,validation_passed,status) VALUES ('migration-test','2025-26','fixture',repeat('a',64),'{}','{}',true,'staged')"
          psql -h localhost -U knicksiq -d knicksiq_upgrade -v ON_ERROR_STOP=1 -c \
            "INSERT INTO games (nba_game_id,season,game_date,home_team_id,away_team_id,home_score,away_score,status,season_type,data_status,release_id) SELECT nba_game_id,season,game_date,home_team_id,away_team_id,home_score,away_score,status,season_type,data_status,(SELECT id FROM dataset_releases WHERE version='migration-test') FROM games WHERE nba_game_id='legacy-game' AND release_id IS NULL"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.4.1"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
        env:
          VITE_API_URL: https://api.knicksiq.win
          VITE_PUBLIC_URL: https://www.knicksiq.win
      - run: pnpm test
      - run: pnpm e2e
      - name: Preserve synthetic browser routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-network-evidence
          path: apps/web/playwright-report
          if-no-files-found: error
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          build-contexts: |
            python:3.12.11-slim-bookworm=docker-image://public.ecr.aws/docker/library/python@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
          push: false
          load: true
          tags: knicksiq-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          build-contexts: |
            node:24.4.1-alpine3.22=docker-image://public.ecr.aws/docker/library/node@sha256:820e86612c21d0636580206d802a726f2595366e1b867e564cbc652024151e8a
            nginxinc/nginx-unprivileged:1.29.0-alpine3.22=docker-image://public.ecr.aws/nginx/nginx-unprivileged@sha256:82dcf28da5a8cd97d43e8f8a64de766658b0c5fb9072368c5f0a9048c417a934
          push: false
          load: true
          tags: knicksiq-web:ci
      - name: Scan API image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: knicksiq-api:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan web image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: knicksiq-web:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3
