[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api"
  to = "/not-found.txt"
  status = 404
  force = true

[[redirects]]
  from = "/health"
  to = "/not-found.txt"
  status = 404
  force = true

[[redirects]]
  from = "/health/*"
  to = "/not-found.txt"
  status = 404
  force = true

[[redirects]]
  from = "/archive/status/*"
  to = "/not-found.txt"
  status = 404
  force = true

